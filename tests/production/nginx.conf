events {}
http {
  # Query strings and auth callback codes are deliberately omitted from access logs.
  access_log off;
  error_log /dev/stderr warn;
  server {
    listen 8443 ssl;
    server_name saveit.localhost idp.localhost;
    ssl_certificate /run/config/tls.crt;
    ssl_certificate_key /run/config/tls.key;
    client_max_body_size 1m;
    location / {
      set $upstream http://web:3000;
      if ($host = idp.localhost) { set $upstream http://identity:8080; }
      resolver 127.0.0.11 ipv6=off;
      proxy_pass $upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
  }
}
