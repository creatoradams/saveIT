services:
  db:
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    environment:
      POSTGRES_PASSWORD: synthetic-container-admin-only
      POSTGRES_DB: saveit
    command:
      [
        "postgres",
        "-c",
        "ssl=on",
        "-c",
        "ssl_cert_file=/run/config/pg.crt",
        "-c",
        "ssl_key_file=/run/config/pg.key",
      ]
    volumes:
      - ../../.local/container-fixture:/run/config:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saveit"]
      interval: 2s
      timeout: 3s
      retries: 30
  deployment:
    image: saveit-deployment:test
    profiles: ["tools"]
    environment:
      SAVEIT_DEPLOYMENT_CONNECTION: Host=db;Database=saveit;Username=synthetic_deployer;Password=synthetic-deployer-only;SSL Mode=VerifyFull;Root Certificate=/run/config/ca.crt
      SAVEIT_ACCESS_CONNECTION: Host=db;Database=saveit;Username=synthetic_access;Password=synthetic-access-only;SSL Mode=VerifyFull;Root Certificate=/run/config/ca.crt
    volumes:
      - ../../.local/container-fixture:/run/config:ro
      - ./provision.json:/run/provision.json:ro
      - ./foreign-provision.json:/run/foreign-provision.json:ro
  api:
    image: saveit-api:test
    read_only: true
    tmpfs: ["/tmp:uid=1654,gid=1654,mode=0700"]
    environment:
      ConnectionStrings__App: Host=db;Database=saveit;Username=saveit_app;Password=synthetic-app-only;SSL Mode=VerifyFull;Root Certificate=/run/config/ca.crt
      AllowedHosts: api;saveit.localhost;localhost;127.0.0.1
      DevelopmentIdentity__Enabled: "false"
      Identity__Okta__Enabled: "true"
      Identity__Okta__Issuer: https://idp.localhost:8443
      Identity__Okta__PublicOrigin: https://saveit.localhost:8443
      Identity__Okta__TenantId: 30000000-0000-0000-0000-000000000001
      Identity__Okta__ClientId: synthetic-client
      Identity__Okta__ClientSecret: synthetic-container-only
      Identity__KeyDirectory: /keys
      Identity__KeyCertificatePath: /run/config/protection.pfx
      Identity__KeyCertificatePassword: synthetic-container-only
      Identity__PreviousKeyCertificates__0__Path: /run/config/previous.pfx
      Identity__PreviousKeyCertificates__0__Password: synthetic-container-only
      SSL_CERT_FILE: /run/config/ca.crt
      Deployment__TrustedProxies__0: 172.30.100.20
    volumes:
      - ../../.local/container-fixture:/run/config:ro
      - keyring:/keys
  worker:
    image: saveit-worker:test
    read_only: true
    tmpfs: ["/tmp:uid=1654,gid=1654,mode=0700"]
    environment:
      ConnectionStrings__SearchWorker: Host=db;Database=saveit;Username=saveit_search_worker;Password=synthetic-worker-only;SSL Mode=VerifyFull;Root Certificate=/run/config/ca.crt
      SearchWorker__Tenants__0: 30000000-0000-0000-0000-000000000001
      SearchWorker__HealthPath: /tmp/saveit-worker-health.json
    volumes:
      - ../../.local/container-fixture:/run/config:ro
  web:
    image: saveit-web:test
    read_only: true
    tmpfs: ["/tmp:uid=1654,gid=1654,mode=0700"]
    environment:
      SAVEIT_API_ORIGIN: http://api:8080
      SAVEIT_PUBLIC_ORIGIN: https://saveit.localhost:8443
      SAVEIT_OKTA_ISSUER: https://idp.localhost:8443
    networks:
      default:
        ipv4_address: 172.30.100.20
  identity:
    image: saveit-identity-fixture:test
    read_only: true
    tmpfs: ["/tmp:uid=1654,gid=1654,mode=0700"]
    environment:
      AllowedHosts: idp.localhost;identity;localhost;127.0.0.1
      Fixture__Issuer: https://idp.localhost:8443
      Fixture__PublicOrigin: https://saveit.localhost:8443
  edge:
    image: nginx:1.29.5-alpine@sha256:1eff5a5f3fcf8431a0abb7eddf5471fec24e5e1905a2581aeacdb07a4479b92b
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../.local/container-fixture:/run/config:ro
    networks:
      default:
        aliases: ["idp.localhost", "saveit.localhost"]
volumes:
  keyring:
  recovered_keyring:
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.100.0/24
