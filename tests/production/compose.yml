services:
  db:
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    environment:
      POSTGRES_PASSWORD: synthetic-container-admin-only
      POSTGRES_DB: saveit
    command:
      [
        "postgres",
        "-c",
        "ssl=on",
        "-c",
        "ssl_cert_file=/run/config/pg.crt",
        "-c",
        "ssl_key_file=/run/config/pg.key",
      ]
    volumes:
      - ../../.local/container-fixture:/run/config:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saveit"]
      interval: 2s
      timeout: 3s
      retries: 30
  deployment:
    image: saveit-deployment:test
    profiles: ["tools"]
    environment:
      SAVEIT_DEPLOYMENT_CONNECTION: Host=db;Database=saveit;Username=synthetic_deployer;Password=synthetic-deployer-only;SSL Mode=VerifyFull
      SAVEIT_ACCESS_CONNECTION: Host=db;Database=saveit;Username=synthetic_access;Password=synthetic-access-only;SSL Mode=VerifyFull
      Deployment__Trust__DatabaseCaSha256: ${SAVEIT_DATABASE_CA_SHA256:?Prepare public trust before running the fixture}
    volumes:
      - ../../.local/container-fixture:/run/config:ro
      - ./provision.json:/run/provision.json:ro
      - ./foreign-provision.json:/run/foreign-provision.json:ro
  api:
    image: saveit-api:test
    env_file: ["../../.local/container-fixture/api-tls.env"]
    read_only: true
    tmpfs: ["/tmp:uid=1654,gid=1654,mode=0700"]
    environment:
      ConnectionStrings__App: Host=db;Database=saveit;Username=saveit_app;Password=synthetic-app-only;SSL Mode=VerifyFull
      AllowedHosts: api;saveit.localhost;localhost;127.0.0.1
      # Deliberately conflicting host shorthand: fixed code listeners must win.
      ASPNETCORE_URLS: http://0.0.0.0:9999
      DevelopmentIdentity__Enabled: "false"
      Identity__Okta__Enabled: "true"
      Identity__Okta__Issuer: https://idp.localhost:8443
      Identity__Okta__PublicOrigin: https://saveit.localhost:8443
      Identity__Okta__TenantId: 30000000-0000-0000-0000-000000000001
      Identity__Okta__ClientId: synthetic-client
      Identity__Okta__ClientSecret: synthetic-container-only
      Identity__KeyDirectory: /keys
      Identity__KeyCertificatePath: /run/config/protection.pfx
      Identity__KeyCertificatePassword: synthetic-container-only
      Identity__PreviousKeyCertificates__0__Path: /run/config/previous.pfx
      Identity__PreviousKeyCertificates__0__Password: synthetic-container-only
      SSL_CERT_FILE: /opt/saveit/trust/database-ca.crt
      Deployment__ApiTls__Enabled: "true"
      Deployment__ApiTls__ClientAuthentication__Enabled: "true"
      Deployment__ApiTls__ClientAuthentication__CaSha256: ${SAVEIT_CLIENT_CA_SHA256:?Prepare client trust before running the fixture}
      Deployment__ApiTls__ClientAuthentication__LeafSha256__0: ${SAVEIT_CLIENT_PIN_VALID:?Prepare client pins before running the fixture}
      Deployment__ApiTls__ClientAuthentication__LeafSha256__1: ${SAVEIT_CLIENT_PIN_SPARE:?Prepare client pins before running the fixture}
      Deployment__Trust__DatabaseCaSha256: ${SAVEIT_DATABASE_CA_SHA256:?Prepare public trust before running the fixture}
    volumes:
      - ../../.local/container-fixture:/run/config:ro
      - keyring:/keys
    networks:
      default:
        aliases: ["api-wrong"]
  api-client-auth:
    extends: { service: api }
    profiles: ["tools"]
    environment:
      AllowedHosts: api;api-client-auth;saveit.localhost;localhost;127.0.0.1
      Deployment__ApiTls__ClientAuthentication__Enabled: "true"
      Deployment__ApiTls__ClientAuthentication__CaSha256: ${SAVEIT_CLIENT_CA_SHA256:-unconfigured}
      Deployment__ApiTls__ClientAuthentication__LeafSha256__0: ${SAVEIT_CLIENT_PIN_VALID:-unconfigured}
      Deployment__ApiTls__ClientAuthentication__LeafSha256__1: ${SAVEIT_CLIENT_PIN_SPARE:-unconfigured}
      Deployment__ApiTls__ClientAuthentication__LeafSha256__2: ${SAVEIT_CLIENT_PIN_EXPIRED:-unconfigured}
      Deployment__ApiTls__ClientAuthentication__LeafSha256__3: ${SAVEIT_CLIENT_PIN_FOREIGN:-unconfigured}
  api-server-only:
    extends: { service: api }
    profiles: ["tools"]
    environment:
      AllowedHosts: api-server-only;saveit.localhost;localhost;127.0.0.1
      Deployment__ApiTls__ClientAuthentication__Enabled: "false"
      Deployment__ApiTls__ClientAuthentication__CaSha256: !reset null
      Deployment__ApiTls__ClientAuthentication__LeafSha256__0: !reset null
      Deployment__ApiTls__ClientAuthentication__LeafSha256__1: !reset null
  relay:
    image: saveit-deployment:test
    profiles: ["tools"]
    read_only: true
    # Deliberately conflicting ambient listener configuration must be ignored.
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:9999
    labels:
      com.saveit.relay-fixture: saveit-release
  worker:
    image: saveit-worker:test
    read_only: true
    tmpfs: ["/tmp:uid=1654,gid=1654,mode=0700"]
    environment:
      ConnectionStrings__SearchWorker: Host=db;Database=saveit;Username=saveit_search_worker;Password=synthetic-worker-only;SSL Mode=VerifyFull
      SearchWorker__Tenants__0: 30000000-0000-0000-0000-000000000001
      SearchWorker__HealthPath: /var/saveit/runtime/saveit-worker-health.json
      Deployment__Trust__DatabaseCaSha256: ${SAVEIT_DATABASE_CA_SHA256:?Prepare public trust before running the fixture}
    volumes:
      - ../../.local/container-fixture:/run/config:ro
  web:
    image: saveit-web:test
    read_only: true
    tmpfs: ["/tmp:uid=1654,gid=1654,mode=0700"]
    environment:
      SAVEIT_API_ORIGIN: https://relay:8443
      NODE_EXTRA_CA_CERTS: /opt/saveit/trust/api-ca.crt
      SAVEIT_API_CA_SHA256: ${SAVEIT_API_CA_SHA256:?Prepare public trust before running the fixture}
      SAVEIT_PUBLIC_ORIGIN: https://saveit.localhost:8443
      SAVEIT_OKTA_ISSUER: https://idp.localhost:8443
  compute-provider:
    image: saveit-web:test
    profiles: ["tools"]
    read_only: true
    sysctls: { net.ipv4.ip_unprivileged_port_start: 0 }
    command: ["/run/compute/provider.mjs"]
    labels: { com.saveit.compute-fixture: saveit-release }
    volumes:
      - ./compute-provider.mjs:/run/compute/provider.mjs:ro
      - ./synthetic-sigv4.mjs:/run/compute/synthetic-sigv4.mjs:ro
      - ../../infra/terraform/ecs-tasks/tests/compute-release-observations.json:/run/compute/observations.json:ro
      - ../../infra/terraform/private-services/tests/compute-parked-observations.json:/run/compute/parked.json:ro
      - ../../.local/container-fixture/compute-images.json:/run/compute/images.json:ro
      - ../../.local/container-fixture/compute-private.json:/run/compute/private.json:ro
      - ../../.local/container-fixture/compute-groups.xml:/run/compute/groups.xml:ro
      - ../../infra/terraform/cell-foundation/tests/compute-route-observations.json:/run/compute/routes.json:ro
      - ../../infra/terraform/runtime-endpoints/tests/compute-endpoint-observations.json:/run/compute/endpoints.json:ro
      - ../../.local/container-fixture/ca.crt:/run/compute/ca.crt:ro
      - ../../.local/container-fixture/compute.key:/run/compute/compute.key:ro
      - ../../.local/container-fixture/compute.crt:/run/compute/compute.crt:ro
      - ../../.local/container-fixture/compute-wrong.crt:/run/compute/compute-wrong.crt:ro
    networks:
      compute:
        aliases:
          [
            "sts.us-east-1.amazonaws.com",
            "ecs.us-east-1.amazonaws.com",
            "ec2.us-east-1.amazonaws.com",
            "api.ecr.us-east-1.amazonaws.com",
            "secretsmanager.us-east-1.amazonaws.com",
            "111122223333.dkr.ecr.us-east-1.amazonaws.com",
          ]
  compute-foreign-provider:
    image: saveit-web:test
    profiles: ["tools"]
    read_only: true
    sysctls: { net.ipv4.ip_unprivileged_port_start: 0 }
    command: ["/run/compute/foreign-provider.mjs"]
    labels: { com.saveit.compute-fixture: saveit-release }
    volumes:
      - ./compute-foreign-provider.mjs:/run/compute/foreign-provider.mjs:ro
      - ../../.local/container-fixture/compute.key:/run/compute/compute.key:ro
      - ../../.local/container-fixture/compute.crt:/run/compute/compute.crt:ro
    networks:
      compute:
        aliases: ["foreign-control.invalid"]
  workload-provider:
    image: saveit-web:test
    profiles: ["tools"]
    read_only: true
    sysctls: { net.ipv4.ip_unprivileged_port_start: 0 }
    command: ["/run/workload/workload-provider.mjs"]
    volumes:
      - ./workload-provider.mjs:/run/workload/workload-provider.mjs:ro
      - ./synthetic-sigv4.mjs:/run/workload/synthetic-sigv4.mjs:ro
      - ../../.local/container-fixture/cognito.key:/run/workload/cognito.key:ro
      - ../../.local/container-fixture/cognito.crt:/run/workload/cognito.crt:ro
      - ../../.local/container-fixture/workload.key:/run/workload/workload.key:ro
    networks:
      workload:
        ipv4_address: 169.254.170.2
        aliases: ["cognito-identity.us-east-1.amazonaws.com"]
  relay-workload:
    extends: { service: relay }
    networks: ["default", "workload"]
    environment:
      SAVEIT_WORKLOAD_POOL_ID: us-east-1:10000000-0000-0000-0000-000000000001
      SAVEIT_WORKLOAD_PROVIDER: saveit.pilot.staging.web
      SAVEIT_WORKLOAD_ISSUER: https://cognito-identity.amazonaws.com
      SAVEIT_WORKLOAD_JWKS_SHA256: ${SAVEIT_WORKLOAD_JWKS_SHA256:-unconfigured}
  web-workload:
    extends: { service: web }
    profiles: ["tools"]
    environment:
      SAVEIT_API_ORIGIN: https://relay-workload:8443
      SAVEIT_WORKLOAD_POOL_ID: us-east-1:10000000-0000-0000-0000-000000000001
      SAVEIT_WORKLOAD_PROVIDER: saveit.pilot.staging.web
      SAVEIT_WORKLOAD_ACCOUNT_ID: "111122223333"
      AWS_CONTAINER_CREDENTIALS_RELATIVE_URI: /v2/credentials/20000000-0000-0000-0000-000000000001
    networks: ["workload"]
  identity:
    image: saveit-identity-fixture:test
    read_only: true
    tmpfs: ["/tmp:uid=1654,gid=1654,mode=0700"]
    environment:
      AllowedHosts: idp.localhost;identity;localhost;127.0.0.1
      Fixture__Issuer: https://idp.localhost:8443
      Fixture__PublicOrigin: https://saveit.localhost:8443
  edge:
    image: nginx:1.29.5-alpine@sha256:1eff5a5f3fcf8431a0abb7eddf5471fec24e5e1905a2581aeacdb07a4479b92b
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../.local/container-fixture:/run/config:ro
    networks:
      default:
        aliases: ["idp.localhost", "saveit.localhost"]
volumes:
  keyring:
  recovered_keyring:
networks:
  compute:
    internal: true
  workload:
    internal: true
    ipam:
      config: [{ subnet: 169.254.170.0/24 }]
  default:
    ipam:
      config:
        - subnet: 172.30.100.0/24
