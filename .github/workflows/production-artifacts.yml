name: SaveIT production artifacts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  packaged:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.22.2"
          cache: npm
      - run: npm ci
      - name: Prepare synthetic public-only trust release input
        run: bash scripts/prepare-production-trust.sh
      - name: Build immutable non-root process images
        run: |
          for target in api worker deployment identity-fixture; do
            if [ "$target" = identity-fixture ]; then name=identity-fixture; else name=$target; fi
            docker build -f infra/containers/dotnet.Dockerfile --build-context saveit-trust=.local/public-trust --build-context saveit-relay-trust=.local/public-trust --build-context saveit-client-trust=.local/client-trust --build-context saveit-workload-trust=.local/workload-trust --build-arg "SAVEIT_REVISION=$GITHUB_SHA" --target "$target" -t "saveit-$name:test" .
          done
          docker build -f infra/containers/web.Dockerfile --build-context saveit-trust=.local/public-trust --build-arg "SAVEIT_REVISION=$GITHUB_SHA" -t saveit-web:test .
      - run: npx playwright install --with-deps chromium
      - name: Verify packaged Production-mode behavior with synthetic external identity
        run: bash scripts/test-production.sh
      - name: Inventory the same verified release images
        id: inventory
        run: |
          node scripts/security-tools.mjs syft
          node scripts/test-image-inventory.mjs
          node scripts/release-inventory.mjs
      - name: Reject vulnerable release images with a current verified database
        run: |
          node scripts/security-tools.mjs grype
          node scripts/scan-image-vulnerabilities.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.inventory.outcome == 'success'
        with:
          name: saveit-release-inventory-${{ github.sha }}
          path: test-results/release-inventory/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: saveit-production-test-evidence
          path: test-results/
          retention-days: 7
