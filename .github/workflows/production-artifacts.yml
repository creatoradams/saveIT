name: SaveIT production artifacts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  packaged:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.16.0"
          cache: npm
      - run: npm ci
      - name: Build immutable non-root process images
        run: |
          for target in api worker deployment identity-fixture; do
            if [ "$target" = identity-fixture ]; then name=identity-fixture; else name=$target; fi
            docker build -f infra/containers/dotnet.Dockerfile --target "$target" -t "saveit-$name:test" .
          done
          docker build -f infra/containers/web.Dockerfile -t saveit-web:test .
      - run: npx playwright install --with-deps chromium
      - name: Verify packaged Production-mode behavior with synthetic external identity
        run: bash scripts/test-production.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: saveit-production-test-evidence
          path: test-results/
          retention-days: 7
